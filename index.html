<style>
:root{
  --bg:#1A0A00;
  --surface:#2B1200;
  --card:#261000;
  --card2:#321500;
  --ink:#FFF5E0;
  --mut:#C4916A;
  --accent:#FF6B00;
  --accent2:#FFD700;
  --red:#E5156F;
  --line:#4A2000;
  --grn:#2ECC71;
  --gold:#FFD700;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px)
}
html{scroll-padding-top:env(safe-area-inset-top,0px);color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 Nunito,system-ui,sans-serif;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}

/* ── FONDO ANIMADO ── */
#bg-anim{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.food-icon{position:absolute;font-size:1.8rem;opacity:0.07;animation:floatUp linear infinite;user-select:none}
@keyframes floatUp{
  0%{transform:translateY(110vh) rotate(0deg);opacity:0}
  10%{opacity:0.08}
  90%{opacity:0.08}
  100%{transform:translateY(-10vh) rotate(360deg);opacity:0}
}

/* ── LOGO ── */
.logo-wrap{display:flex;flex-direction:column;align-items:center;padding:28px 0 10px;position:relative;z-index:2}
.logo-flame{font-size:3rem;animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1) rotate(-3deg)}50%{transform:scale(1.12) rotate(3deg)}}
.logo-title{font-family:"Fredoka One",system-ui,sans-serif;font-size:clamp(2rem,9vw,3.4rem);line-height:1;
  background:linear-gradient(135deg,#FF6B00,#FFD700,#FF6B00);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  text-shadow:none;letter-spacing:.02em;margin:4px 0 2px}
.logo-sub{font-family:Nunito,sans-serif;font-weight:800;font-size:.9rem;color:var(--mut);letter-spacing:.12em;text-transform:uppercase}

.wrap{max-width:960px;margin:0 auto;padding:0 16px;position:relative;z-index:2}

/* ── BARRA DUEÑO ── */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:11;background:#100500;color:#fff;
  padding:9px 14px;display:flex;gap:7px;align-items:center;flex-wrap:wrap;font-size:.85rem;
  border-bottom:1px solid var(--line)}
.bar button{font:800 .85rem Nunito,sans-serif;border:0;border-radius:9px;padding:7px 11px;background:#3A1A00;color:#fff;cursor:pointer}
.bar .pub{background:var(--gold);color:#222}
.bar button:disabled{opacity:.4;cursor:default}
.bar button:focus-visible{outline:3px solid var(--accent2);outline-offset:2px}
.warn{background:#3A1A00;color:var(--accent2);padding:8px 16px;font-size:.88rem;text-align:center}

/* ── HERO ── */
.hero{padding:4px 0 18px;text-align:center}
.hero p{color:var(--mut);max-width:34ch;margin:0 auto 16px;font-size:.95rem}

/* ── CHIPS ── */
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 14px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:2px solid var(--line);background:var(--card2);color:var(--ink);
  font:800 .92rem Nunito,sans-serif;border-radius:99px;padding:7px 16px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.chip:focus-visible{outline:3px solid var(--accent2);outline-offset:2px}

/* ── GRID ── */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:600px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:860px){.grid{grid-template-columns:repeat(4,1fr);gap:16px}}

/* ── CARD ── */
.card{all:unset;box-sizing:border-box;cursor:pointer;background:var(--card);border:1px solid var(--line);
  border-radius:18px;overflow:hidden;display:flex;flex-direction:column;transition:transform .15s,box-shadow .15s}
.card:hover{transform:translateY(-3px);box-shadow:0 8px 24px rgba(255,107,0,.18)}
.card:focus-visible{outline:3px solid var(--accent2);outline-offset:2px}
.card .t{padding:9px 11px 13px}
.card h3{font-family:"Fredoka One",sans-serif;font-size:1rem;line-height:1.2;margin:0 0 2px}
.card .k{color:var(--mut);font-size:.78rem}
.card .p{font-weight:800;color:var(--accent2);margin-top:5px;font-size:1.05rem}

/* ── ART ── */
.art{aspect-ratio:1;width:100%;display:grid;place-items:center;font-size:3rem;
  background:linear-gradient(135deg,#2B1200,#3D1800);position:relative;overflow:hidden}
.art img{width:100%;height:100%;object-fit:cover;display:block}
.art-badge{position:absolute;top:7px;right:7px;background:var(--accent);color:#fff;
  font:800 .7rem Nunito,sans-serif;border-radius:99px;padding:2px 7px}

/* ── SHEET (BOTTOM SHEET) ── */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:flex-end;justify-content:center;z-index:20}
.ov.on{display:flex}
.sheet{background:var(--card);width:100%;max-width:520px;max-height:93%;overflow:auto;
  border-radius:24px 24px 0 0;padding:0 0 calc(20px + env(safe-area-inset-bottom,0px));
  position:relative;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(36px);opacity:0}}
@media(prefers-reduced-motion:reduce){.sheet{animation:none}}
@media(min-width:600px){.ov{align-items:center}.sheet{border-radius:24px}}
.sheet .in{padding:14px 18px 0}
.sheet h2{font-family:"Fredoka One",sans-serif;font-size:1.6rem;margin:0 0 2px}
.sheet .sp{font:800 1.4rem "Fredoka One",sans-serif;color:var(--accent2);margin:0 0 8px}
.sheet .sd{color:var(--mut);margin:0 0 14px;font-size:.92rem}
.x{position:absolute;top:11px;right:11px;width:38px;height:38px;border-radius:50%;border:0;
  background:rgba(255,255,255,.1);color:var(--ink);font-size:1.2rem;cursor:pointer;z-index:2}
.x:focus-visible{outline:3px solid var(--accent2)}

/* ── SIZES / EXTRAS ── */
.szlabel{font-weight:800;font-size:.88rem;margin:0 0 6px;display:block}
.szs{display:flex;gap:7px;margin-bottom:14px;flex-wrap:wrap}
.sz{border:2px solid var(--line);background:var(--card2);color:var(--ink);border-radius:10px;
  min-width:44px;padding:7px 11px;font:800 .88rem Nunito,sans-serif;cursor:pointer}
.sz[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:#fff}
.sz:focus-visible{outline:3px solid var(--accent2);outline-offset:2px}

/* ── CANTIDAD ── */
.qlabel{font-weight:800;font-size:.88rem;margin:0 0 6px;display:block}
.qs{display:inline-flex;align-items:center;gap:10px;margin-bottom:14px}
.qs button{width:36px;height:36px;border-radius:50%;border:2px solid var(--line);
  background:var(--card2);color:var(--ink);font:800 1.2rem Nunito,sans-serif;cursor:pointer}
.qs button:focus-visible{outline:3px solid var(--accent2)}
.qs span{min-width:22px;text-align:center;font-weight:800;font-size:1.1rem}

/* ── MENSAJES ── */
.err{color:var(--red);font-weight:800;margin:0 0 10px;font-size:.9rem}
.okm{color:var(--grn);font-weight:800;margin:0 0 10px;font-size:.9rem}

/* ── BOTONES ── */
.btn{display:block;width:100%;font:800 1rem Nunito,sans-serif;border-radius:13px;padding:13px 18px;
  border:0;cursor:pointer;text-align:center;text-decoration:none;background:var(--accent);color:#fff}
.btn:focus-visible{outline:3px solid var(--accent2);outline-offset:2px}
.btn2{display:inline-block;font:800 .9rem Nunito,sans-serif;border-radius:11px;padding:9px 13px;
  border:2px solid var(--line);background:var(--card2);color:var(--ink);cursor:pointer;text-decoration:none;margin:0 6px 6px 0}
.btn2:focus-visible{outline:3px solid var(--accent2);outline-offset:2px}
.del{color:var(--red);border-color:var(--red);width:100%;margin:10px 0 0;display:block}

/* ── FORM ── */
.f label{display:block;font-weight:800;font-size:.88rem;margin:0 0 10px}
.f input,.f textarea,.f select{display:block;width:100%;margin-top:5px;padding:9px 11px;
  border:2px solid var(--line);border-radius:11px;background:var(--surface);color:var(--ink);
  font:400 .95rem Nunito,sans-serif}
.f input:focus,.f textarea:focus,.f select:focus{outline:2px solid var(--accent);outline-offset:1px}
.f small{display:block;color:var(--mut);font-weight:400;margin-top:3px}

/* ── CARRITO ── */
.cartbar{position:fixed;left:14px;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));
  max-width:520px;margin:0 auto;z-index:15;background:var(--accent);color:#fff;
  border:0;border-radius:14px;padding:13px 18px;font:800 1rem Nunito,sans-serif;
  box-shadow:0 6px 24px rgba(255,107,0,.4);cursor:pointer}
.cartbar:focus-visible{outline:3px solid var(--accent2)}
.ln{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.ln>div:first-child{flex:1}
.ln small{display:block;color:var(--mut);font-size:.82rem}
.tot{display:flex;justify-content:space-between;font:800 1.3rem "Fredoka One",sans-serif;padding:14px 0}

footer{color:var(--mut);font-size:.82rem;text-align:center;padding:16px 0 90px}

/* ── AJUSTES MULTI-NEGOCIO ── */
.neglist{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.negitem{display:flex;align-items:center;gap:8px;background:var(--card2);border:1px solid var(--line);
  border-radius:11px;padding:10px 12px;cursor:pointer}
.negitem.active{border-color:var(--accent)}
.negitem b{flex:1;font-family:"Fredoka One",sans-serif;font-size:1rem}
.negitem small{color:var(--mut);font-size:.8rem}
.badge-active{background:var(--accent);color:#fff;font:800 .7rem Nunito,sans-serif;
  border-radius:99px;padding:2px 7px}
</style>
</head>

<script>
// ── UTILIDADES ──
const $ = s => document.querySelector(s);
const esc = t => String(t==null?"":t).replace(/[&<>"']/g,c=>({"&":"&","<":"<",">":">",'"':""","'":"'"}[c]));

// ── ESTADO ──
let DB;
try { DB = JSON.parse(localStorage.getItem("gustosabor_db") || "null"); } catch(e) {}
if (!DB) DB = JSON.parse($("#data").textContent);
const saveDB = () => { try { localStorage.setItem("gustosabor_db", JSON.stringify(DB)); } catch(e) {} };

let cart = [];
try { cart = JSON.parse(localStorage.getItem("gustosabor_cart") || "[]"); } catch(e) {}
const saveCart = () => { try { localStorage.setItem("gustosabor_cart", JSON.stringify(cart)); } catch(e) {} };

let cat = "Todo", cur = null, last = null, owner = false, dirty = false;
let sel = { part:null, extras:[], q:1, m:"", ok:"" };

const getNeg = () => DB.negocios.find(n => n.id === DB.activeNeg) || DB.negocios[0];
const getP   = () => getNeg().productos;
const S      = () => getNeg();

const mo  = n => (n===""||n==null) ? "Consultar" : S().cur + Number(n).toLocaleString("es");
const cnt = () => cart.reduce((a,l) => a+l.q, 0);
const tot = () => cart.reduce((a,l) => a+(l.p===""||l.p==null?0:l.p*l.q), 0);

// ── FONDO ANIMADO ──
const ICONS = ["🍔","🍗","🍟","🧀","🥚","🌶️","🧅","🥩","🍖","🌮","🧆","🥓"];
(function spawnIcons(){
  const bg = $("#bg-anim");
  function spawn(){
    const el = document.createElement("span");
    el.className = "food-icon";
    el.textContent = ICONS[Math.floor(Math.random()*ICONS.length)];
    el.style.left = Math.random()*100 + "vw";
    el.style.animationDuration = (14+Math.random()*18)+"s";
    el.style.animationDelay = (Math.random()*6)+"s";
    el.style.fontSize = (.9+Math.random()*1.6)+"rem";
    bg.appendChild(el);
    setTimeout(()=>el.remove(), 36000);
  }
  for(let i=0;i<18;i++) spawn();
  setInterval(spawn, 2200);
})();

// ── RENDER PRINCIPAL ──
function render(){
  const P = getP();
  const neg = getNeg();
  const cats = ["Todo",...new Set(P.map(p=>p.c).filter(Boolean))];
  const shown = P.filter(p => cat==="Todo" || p.c===cat);

  $("#root").innerHTML = `
    ${owner ? `<div class="bar">
      <b>🔑 Dueño</b>
      <button data-a="negocios">🏪 Negocios</button>
      <button data-a="add">+ Producto</button>
      <button data-a="set">⚙️ Ajustes</button>
      <button class="pub" data-a="save" ${dirty?"":"disabled"}>💾 Guardar</button>
      <button data-a="dl" style="background:#2E9E5B">⬇️ Descargar HTML</button>
      <button data-a="copyhtml" style="background:#1A6B9A">📋 Copiar HTML</button>
      <span id="st" style="color:var(--accent2);font-size:.8rem">${dirty?"• Sin guardar":""}</span>
    </div>` : ""}
    ${!neg.wa ? '<div class="warn">⚠️ Configura tu WhatsApp en Ajustes para recibir pedidos.</div>' : ""}
    <div class="wrap">
      <div class="logo-wrap">
        <div class="logo-flame">🔥</div>
        <div class="logo-title">${esc(neg.name)}</div>
        <div class="logo-sub">${esc(neg.h)}</div>
      </div>
      <section class="hero">
        <p>Elige tu plato, personaliza y envía tu pedido por WhatsApp. ¡Rápido y fácil!</p>
      </section>
      <div class="chips" role="tablist">
        ${cats.map(c=>`<button class="chip" role="tab" aria-pressed="${c===cat}" data-c="${esc(c)}">${esc(c)}</button>`).join("")}
      </div>
      <div class="grid">
        ${shown.map(p=>`<button class="card" data-id="${p.id}">
          ${artEl(p)}
          <div class="t">
            <h3>${esc(p.n)}</h3>
            <div class="k">${esc(p.c)}</div>
            <div class="p">${money(p)}</div>
          </div>
        </button>`).join("")}
      </div>
      <footer>
        🍴 Pide por WhatsApp · Recojo y delivery<br>
        ${neg.upd ? `<small>Actualizado: ${new Date(neg.upd).toLocaleString("es",{dateStyle:"medium",timeStyle:"short"})}</small>` : ""}
      </footer>
    </div>
    ${cart.length ? `<button class="cartbar" data-a="cart">🛒 Ver pedido (${cnt()}) · ${mo(tot())}</button>` : ""}
  `;
}

function artEl(p){
  if(p.img) return `<div class="art"><img src="${p.img}" alt="${esc(p.n)}"><span class="art-badge">📷</span></div>`;
  return `<div class="art">${p.ill||"🍽️"}</div>`;
}
const money = p => (p.p===""||p.p==null) ? "Consultar" : S().cur+Number(p.p).toLocaleString("es");

// ── EVENTOS ROOT ──
$("#root").onclick = e => {
  const c = e.target.closest("[data-c]");
  const k = e.target.closest("[data-id]");
  const a = e.target.closest("[data-a]");
  if(c){ cat=c.dataset.c; render(); }
  else if(k){
    cur = getP().find(p=>p.id==k.dataset.id);
    last=k; sel={part:null,extras:[],q:1,m:"",ok:""}; view();
  } else if(a){
    const x=a.dataset.a;
    if(x==="add"){ cur={id:Date.now(),n:"Nuevo producto",c:"Hamburguesas",p:"",d:"",parts:[],extras:[],img:""}; getP().unshift(cur); mark(); edit(); }
    if(x==="set") sets();
    if(x==="cart") showCart();
    if(x==="save") save();
    if(x==="dl") descargarHTML();
    if(x==="copyhtml") copiarHTML();
    if(x==="negocios") negocios();
  }
};

// ── SHEET ──
function open(h){ $("#sheet").innerHTML=h; $("#ov").classList.add("on"); const b=$("#close"); if(b)b.focus(); }
function shut(){ $("#ov").classList.remove("on"); render(); if(last&&last.isConnected)last.focus(); }
function mark(){
  dirty=true;
  getNeg().upd = new Date().toISOString();
  const b=document.querySelector('[data-a="save"]'); if(b) b.disabled=false;
  const s=$("#st"); if(s) s.textContent="• Sin guardar";
}

// ── DETALLE PRODUCTO ──
function view(){
  const p=cur;
  open(`
    <button class="x" aria-label="Cerrar" id="close">✕</button>
    ${artEl(p)}
    <div class="in">
      <h2>${esc(p.n)}</h2>
      <div class="sp">${money(p)}</div>
      <div class="sd">${esc(p.d)}</div>
      ${p.parts&&p.parts.length?`
        <span class="szlabel">Elige parte / tamaño</span>
        <div class="szs" role="group">
          ${p.parts.map(s=>`<button class="sz" aria-pressed="${s===sel.part}" data-part="${esc(s)}">${esc(s)}</button>`).join("")}
        </div>`:""}
      ${p.extras&&p.extras.length?`
        <span class="szlabel">Extras (opcional)</span>
        <div class="szs" role="group">
          ${p.extras.map(x=>`<button class="sz" aria-pressed="${sel.extras.includes(x)}" data-extra="${esc(x)}">+${esc(x)}</button>`).join("")}
        </div>`:""}
      <span class="qlabel">Cantidad</span>
      <div class="qs">
        <button data-q="-1" aria-label="Menos">−</button>
        <span>${sel.q}</span>
        <button data-q="1" aria-label="Más">+</button>
      </div>
      ${sel.m?`<div class="err" role="alert">${sel.m}</div>`:""}
      ${sel.ok?`<div class="okm" role="status">${sel.ok}</div>`:""}
      <button class="btn" data-a="addcart">🛒 Agregar al pedido</button>
      ${owner?`<button class="btn2" style="margin-top:10px;width:100%" data-a="edit">✏️ Editar producto</button>`:""}
    </div>
  `);
}

// ── AGREGAR AL CARRITO ──
function add(){
  const p=cur;
  if(p.parts&&p.parts.length&&!sel.part){ sel.m="Elige una parte o tamaño."; return view(); }
  const extrasStr=sel.extras.length?sel.extras.join(", "):"";
  const f=cart.find(l=>l.id===p.id&&l.part===sel.part&&l.extrasStr===extrasStr);
  if(f) f.q=Math.min(99,f.q+sel.q);
  else cart.push({id:p.id,n:p.n,part:sel.part||"",extrasStr,q:sel.q,p:p.p,negId:DB.activeNeg});
  saveCart();
  sel={part:null,extras:[],q:1,m:"",ok:"✓ Agregado. Puedes elegir otra opción."};
  view();
}

// ── LINK WHATSAPP ──
function orderLink(){
  const wa=String(S().wa).replace(/\D/g,"");
  const L=cart.map((l,i)=>
    `${i+1}) ${l.n}\n   ${l.part?"Parte: "+l.part+"\n   ":""}${l.extrasStr?"Extras: "+l.extrasStr+"\n   ":""}Cantidad: ${l.q}`+
    (l.p===""||l.p==null?"":`\n   Subtotal: ${mo(l.p*l.q)}`)
  ).join("\n\n");
  return `https://wa.me/${wa}?text=`+encodeURIComponent(`Hola, quiero hacer este pedido 🍔\n\n${L}\n\nTotal: ${mo(tot())}`);
}

// ── CARRITO ──
function showCart(){
  open(`
    <button class="x" aria-label="Cerrar" id="close">✕</button>
    <div class="in" style="padding-top:52px">
      <h2>🛒 Tu pedido</h2>
      ${cart.length ? cart.map((l,i)=>`
        <div class="ln">
          <div>
            <b>${esc(l.n)}</b>
            <small>${l.part?esc(l.part)+" · ":""}${l.extrasStr?esc(l.extrasStr)+" · ":""}${l.p===""||l.p==null?"":mo(l.p*l.q)}</small>
          </div>
          <div class="qs" style="margin:0">
            <button data-ql="${i},-1">−</button>
            <span>${l.q}</span>
            <button data-ql="${i},1">+</button>
          </div>
          <button data-rm="${i}" style="border:0;background:none;font-size:1.2rem;cursor:pointer">🗑</button>
        </div>`).join("")+`
        <div class="tot"><span>Total</span><span>${mo(tot())}</span></div>
        <a class="btn" target="_blank" rel="noopener" href="${orderLink()}">📲 Enviar por WhatsApp</a>
        <button class="btn2 del" data-a="clear" style="color:var(--mut);border-color:var(--line)">Vaciar pedido</button>
      `:"<p style='color:var(--mut)'>Tu pedido está vacío.</p>"}
    </div>
  `);
}

function edit(){

    <button class="x" aria-label="Cerrar" id="close">✕</button>
    ${artEl(p)}
    <div class="in f">
      <label class="btn2" style="cursor:pointer">📷 ${p.img?"Cambiar foto":"Subir foto"}<input type="file" accept="image/*" hidden id="file"></label>
      ${p.img?'<button class="btn2" data-a="noimg">❌ Quitar foto</button>':""}
      <label>Nombre<input data-f="n" value="${esc(p.n)}"></label>

        ${[...new Set(getP().map(x=>x.c).filter(Boolean))].map(x=>`<option value="${esc(x)}">`).join("")}
        <option value="Hamburguesas"><option value="Pollo Broaster"><option value="Salchipapas">
      </datalist>
      <label>Precio (${esc(S().cur)})<input data-f="p" type="number" inputmode="decimal" min="0" value="${p.p}"></label>
      <label>Descripción<textarea data-f="d" rows="3">${esc(p.d)}</textarea></label>
      <label>Partes / tamaños<input data-f="parts" value="${esc((p.parts||[]).join(", "))}"><small>Separa con comas. Ej: Simple, Doble, Triple</small></label>
      <label>Extras<input data-f="extras" value="${esc((p.extras||[]).join(", "))}"><small>Separa con comas. Ej: Queso, Tocino, Huevo</small></label>
      <label>Emoji (si no hay foto)<input data-f="ill" value="${esc(p.ill||"")}"></label>
      <button class="btn" data-a="done" style="margin-top:4px">✅ Listo</button>
      <button class="btn2 del" data-a="del">🗑 Eliminar producto</button>
    </div>
  `);
}

// ── AJUSTES NEGOCIO ──
function sets(){
  const neg=getNeg();
  open(`
    <button class="x" aria-label="Cerrar" id="close">✕</button>
    <div class="in f" style="padding-top:52px">
      <h2>⚙️ Ajustes</h2>
      <label>Nombre del negocio<input data-st="name" value="${esc(neg.name)}"></label>
      <label>Frase de portada<input data-st="h" value="${esc(neg.h)}"></label>
      <label>WhatsApp para pedidos<input data-st="wa" type="tel" inputmode="numeric" value="${esc(neg.wa)}"><small>Con código de país, sin espacios ni +. Ej: 51942100721</small></label>
      <label>Símbolo de moneda<input data-st="cur" value="${esc(neg.cur)}"></label>
      <button class="btn" data-a="done" style="margin-top:4px">✅ Listo</button>
    </div>

// ── MULTI-NEGOCIO ──
function negocios(){
  open(`
    <button class="x" aria-label="Cerrar" id="close">✕</button>
    <div class="in" style="padding-top:52px">
      <h2>🏪 Mis negocios</h2>
      <p style="color:var(--mut);font-size:.88rem;margin:0 0 14px">Cada negocio tiene su propio menú y WhatsApp.</p>
      <div class="neglist">
        ${DB.negocios.map(n=>`
          <div class="negitem${n.id===DB.activeNeg?" active":""}" data-neg="${n.id}">
            <span style="font-size:1.5rem">🏪</span>
            <div style="flex:1">
              <b>${esc(n.name)}</b>
              <small>📱 ${esc(n.wa||"Sin WhatsApp")}</small>

            ${n.id===DB.activeNeg?'<span class="badge-active">Activo</span>':""}

      </div>
      <button class="btn" data-a="negnew">+ Agregar negocio</button>
    </div>
  `);

// ── COPIAR HTML ──
function copiarHTML(){
  saveDB();
  const htmlActual = document.documentElement.outerHTML;
  const dataActual = JSON.stringify(DB, null, 2);
  const htmlFinal = htmlActual.replace(
    /(<script type="application\/json" id="data">)[\s\S]*?(<\/script>)/,
    `$1\n${dataActual}\n$2`
  );
  // Mostrar en pantalla para copiar y pegar
  open(`
    <button class="x" aria-label="Cerrar" id="close">✕</button>
    <div class="in" style="padding-top:52px">
      <h2 style="margin-bottom:6px">📋 Copiar HTML</h2>
      <p style="color:var(--mut);font-size:.85rem;margin-bottom:14px">
        1️⃣ Toca el botón azul para copiar todo<br>
        2️⃣ Ve a GitHub → tu archivo index.html<br>
        3️⃣ Toca ✏️ editar → borra todo → pega<br>
        4️⃣ Toca Commit changes ✅
      </p>
      <button class="btn" id="btnCopy" style="margin-bottom:12px">📋 Copiar todo el código</button>
      <div id="copyMsg"></div>
      <textarea id="htmlCode" rows="8" style="font-size:.7rem;font-family:monospace;background:#0D0500;color:#FFD700;border:1px solid var(--line);border-radius:10px;padding:10px;width:100%;resize:none">${htmlFinal.replace(/</g,'<').replace(/>/g,'>')}</textarea>
    </div>
  `);
  // Botón copiar
  setTimeout(()=>{
    const btn = document.getElementById("btnCopy");
    const msg = document.getElementById("copyMsg");
    const code = document.getElementById("htmlCode");
    if(btn){
      btn.onclick = ()=>{
        // Texto real sin escape HTML
        const texto = htmlFinal;
        if(navigator.clipboard && navigator.clipboard.writeText){
          navigator.clipboard.writeText(texto).then(()=>{
            btn.textContent = "✅ ¡Copiado!";
            btn.style.background = "#2E9E5B";
            msg.innerHTML = '<p style="color:#2E9E5B;font-weight:800;margin:8px 0">¡Listo! Ahora pégalo en GitHub</p>';
          }).catch(()=>{
            code.select();
            document.execCommand("copy");
            btn.textContent = "✅ ¡Copiado!";
            btn.style.background = "#2E9E5B";
          });
        } else {
          code.select();
          document.execCommand("copy");
          btn.textContent = "✅ ¡Copiado!";
          btn.style.background = "#2E9E5B";
          msg.innerHTML = '<p style="color:#2E9E5B;font-weight:800;margin:8px 0">¡Listo! Ahora pégalo en GitHub</p>';
        }
      };
    }
  }, 100);
}

// ── DESCARGAR HTML ──
function descargarHTML(){
  saveDB();
  const htmlActual = document.documentElement.outerHTML;
  const dataActual = JSON.stringify(DB, null, 2);
  const htmlFinal = htmlActual.replace(
    /(<script type="application\/json" id="data">)[\s\S]*?(<\/script>)/,
    `$1\n${dataActual}\n$2`
  );
  const blob = new Blob([htmlFinal], { type:"text/html;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "index.html";
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
  // Toast
  const t = document.createElement("div");
  t.textContent = "⬇️ Descargando index.html...";
  Object.assign(t.style,{
    position:"fixed",bottom:"90px",left:"50%",transform:"translateX(-50%)",
    background:"#2E9E5B",color:"#fff",padding:"10px 20px",borderRadius:"99px",
    fontFamily:"Nunito,sans-serif",fontWeight:"800",fontSize:".9rem",
    zIndex:"99",whiteSpace:"nowrap",boxShadow:"0 4px 16px rgba(0,0,0,.4)",
    opacity:"1",transition:"opacity .4s"
  });
  document.body.appendChild(t);
  setTimeout(()=>{ t.style.opacity="0"; setTimeout(()=>t.remove(),500); }, 2000);
}

// ── GUARDAR ──
function save(){
  saveDB();
  dirty=false;

  // Genera el HTML completo con los datos actualizados incrustados
  const htmlActual = document.documentElement.outerHTML;
  // Reemplaza el bloque de datos con los datos actuales
  const dataActual = JSON.stringify(DB, null, 2);
  const htmlFinal = htmlActual.replace(
    /(<script type="application\/json" id="data">)[\s\S]*?(<\/script>)/,
    `$1\n${dataActual}\n$2`
  );

  const blob = new Blob([htmlFinal], { type:"text/html;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "index.html";
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 2000);

  const b=document.querySelector('[data-a="save"]'); if(b) b.disabled=true;
  const s=$("#st"); if(s){ s.textContent="✓ Descargado index.html"; setTimeout(()=>{ if(s) s.textContent=""; },3000); }
  render();
}

// ── EVENTOS SHEET ──
const sh=$("#sheet");
sh.onclick = e => {
  const t=e.target;
  const a=t.closest("[data-a]");
  const part=t.closest("[data-part]");
  const extra=t.closest("[data-extra]");
  const q=t.closest("[data-q]");
  const ql=t.closest("[data-ql]");
  const rm=t.closest("[data-rm]");
  const neg=t.closest("[data-neg]");

  if(t.closest("#close")) return shut();

  if(neg && !neg.dataset.a){
    DB.activeNeg=neg.dataset.neg;
    cat="Todo"; cart=[]; saveDB(); negocios(); render(); return;
  }
  if(part){ sel.part=part.dataset.part; sel.m=sel.ok=""; view(); }
  if(extra){
    const x=extra.dataset.extra;
    const i=sel.extras.indexOf(x);
    if(i<0) sel.extras.push(x); else sel.extras.splice(i,1);
    sel.m=sel.ok=""; view();
  }
  if(q){ sel.q=Math.min(99,Math.max(1,sel.q+Number(q.dataset.q))); view(); }
  if(ql){
    const [i,d]=ql.dataset.ql.split(",").map(Number);
    cart[i].q=Math.min(99,Math.max(1,cart[i].q+d));
    saveCart(); showCart();
  }
  if(rm){ cart.splice(Number(rm.dataset.rm),1); saveCart(); showCart(); }

  if(a){
    const x=a.dataset.a;
    if(x==="addcart") add();
    if(x==="cart") showCart();
    if(x==="clear"){ cart=[]; saveCart(); showCart(); }
    if(x==="edit"){ sel={part:null,extras:[],q:1,m:"",ok:""}; edit(); }
    if(x==="done") shut();
    if(x==="noimg"){ cur.img=""; mark(); edit(); }
    if(x==="del"){
      if(a.dataset.sure){
        const P=getP(); P.splice(P.indexOf(cur),1);
        mark(); shut();
      } else { a.dataset.sure=1; a.textContent="¿Seguro? Toca otra vez"; }
    }
    if(x==="negnew"){
      const id="n"+Date.now();
      DB.negocios.push({id,name:"Nuevo negocio",h:"Tu frase aquí",wa:"",cur:"S/.",upd:new Date().toISOString(),productos:[]});
      DB.activeNeg=id; mark(); shut(); sets();
    }
  }
};

sh.oninput = e => {
  const t=e.target;
  const f=t.dataset.f, st=t.dataset.st;
  if(f){
    if(f==="p") cur[f]=t.value===""?"":Number(t.value);
    else if(f==="parts"||f==="extras") cur[f]=t.value.split(",").map(x=>x.trim()).filter(Boolean);
    else cur[f]=t.value;
    mark();
  }
  if(st){ getNeg()[st]=t.value.trim(); mark(); }
};

sh.onchange = async e => {
  if(e.target.id==="file"&&e.target.files[0]){
    cur.img=await shrink(e.target.files[0]);
    mark(); edit();
  }
};

function shrink(f){
  return new Promise(r=>{
    const i=new Image(), u=URL.createObjectURL(f);
    i.onload=()=>{
      const k=Math.min(1,720/Math.max(i.width,i.height));
      const c=document.createElement("canvas");
      c.width=i.width*k; c.height=i.height*k;
      c.getContext("2d").drawImage(i,0,0,c.width,c.height);
      URL.revokeObjectURL(u);
      r(c.toDataURL("image/jpeg",.82));
    };
    i.src=u;
  });
}

// Shift+O = modo dueño (teclado físico)
document.addEventListener("keydown", e=>{
  if(e.shiftKey&&e.key==="O"){ owner=!owner; render(); }
});

// Toque secreto: 5 toques en el logo activan modo dueño
let tapCount = 0, tapTimer = null;
document.addEventListener("click", e=>{
  if(e.target.closest(".logo-flame") || e.target.closest(".logo-title") || e.target.closest(".logo-wrap")){
    tapCount++;
    clearTimeout(tapTimer);
    if(tapCount >= 5){
      tapCount = 0;
      owner = !owner;
      render();
      // Vibración suave si el dispositivo lo soporta
      if(navigator.vibrate) navigator.vibrate([40,30,40]);
      // Toast breve
      const t = document.createElement("div");
      t.textContent = owner ? "🔑 Modo dueño activado" : "🔒 Modo dueño desactivado";
      Object.assign(t.style,{
        position:"fixed",bottom:"90px",left:"50%",transform:"translateX(-50%)",
        background:"#FF6B00",color:"#fff",padding:"10px 20px",borderRadius:"99px",
        fontFamily:"Nunito,sans-serif",fontWeight:"800",fontSize:".9rem",
        zIndex:"99",whiteSpace:"nowrap",boxShadow:"0 4px 16px rgba(0,0,0,.4)",
        animation:"none",opacity:"1",transition:"opacity .4s"
      });
      document.body.appendChild(t);
      setTimeout(()=>{ t.style.opacity="0"; setTimeout(()=>t.remove(),500); }, 1800);
    } else {
      tapTimer = setTimeout(()=>{ tapCount=0; }, 1200);
    }
  }
});

render();
</script>
